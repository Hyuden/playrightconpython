name: Suite de Pruebas Automáticas Playwright

# Triggers: Cuándo debe ejecutarse la pipeline
on:
  workflow_dispatch:  # Permite ejecutar manualmente con un botón en GitHub
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Ejecución de Tests en Servidor Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio de GitHub
    - name: Checkout del proyecto
      uses: actions/checkout@v4

    # 2. Configurar Python en la máquina virtual
    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Instalar dependencias necesarias
    - name: Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright pytest-html allure-pytest

    # 4. Instalar los navegadores de Playwright
    - name: Instalar navegadores de Playwright
      run: |
        playwright install --with-deps chromium

    # 5. Ejecutar la suite de pruebas
    - name: Ejecutar pruebas de Retail con PyTest
      run: |
        pytest tests/ --html=reporte_pipeline.html --self-contained-html

    # 6. Guardar el reporte HTML resultante como un archivo descargable (Artefacto)
    - name: Subir Reporte HTML como Artefacto
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-ejecucion-html
        path: reporte_pipeline.html